<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Blue Head Background -->
  <circle cx="50" cy="50" r="48" fill="#0296e6" stroke="#0166a3" stroke-width="1.5" />
  
  <!-- White Face Patch -->
  <ellipse cx="50" cy="58" rx="40" ry="34" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
  
  <!-- Eyes -->
  <ellipse cx="41" cy="27" rx="9" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <ellipse cx="59" cy="27" rx="9" ry="12" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  
  <!-- Pupils with catchlight -->
  <ellipse cx="44" cy="28" rx="3.5" ry="4.5" fill="#111827" />
  <circle cx="45" cy="26" r="1.2" fill="#ffffff" />
  
  <ellipse cx="56" cy="28" rx="3.5" ry="4.5" fill="#111827" />
  <circle cx="57" cy="26" r="1.2" fill="#ffffff" />
  
  <!-- Red Nose -->
  <circle cx="50" cy="40" r="6" fill="#f43f5e" stroke="#111827" stroke-width="1.2" />
  <circle cx="48" cy="38" r="1.8" fill="#ffffff" />
  
  <!-- Philtrum Line -->
  <line x1="50" y1="46" x2="50" y2="70" stroke="#111827" stroke-width="1.4" />
  
  <!-- Wide Happy Mouth -->
  <path d="M 23 58 Q 50 88 77 58" fill="#e11d48" stroke="#111827" stroke-width="1.4" />
  <!-- Tongue -->
  <path d="M 37 70 Q 50 63 63 70 Q 50 84 37 70 Z" fill="#fda4af" />
  
  <!-- Whiskers Left -->
  <line x1="16" y1="48" x2="35" y2="50" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="14" y1="56" x2="34" y2="56" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="65" x2="35" y2="62" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  
  <!-- Whiskers Right -->
  <line x1="65" y1="50" x2="84" y2="48" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="66" y1="56" x2="86" y2="56" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="65" y1="62" x2="84" y2="65" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  
  <!-- Red Collar Strip -->
  <path d="M 20 92 Q 50 97 80 92" stroke="#ef4444" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Gold Bell -->
  <circle cx="50" cy="94" r="5.5" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
  <line x1="45" y1="92.5" x2="55" y2="92.5" stroke="#78350f" stroke-width="0.8" />
  <circle cx="50" cy="95" r="1.2" fill="#78350f" />
</svg>